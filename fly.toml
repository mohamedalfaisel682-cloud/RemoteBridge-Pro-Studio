app = "remotebridge-signaling"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[checks]
  [checks.ping]
    port = 8080
    type = "http"
    interval = "15s"
    timeout = "2s"
    path = "/"
